<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>데이터베이스 테스트</title>
</head>
<body>
    <h1>User List</h1>

    <!-- 실습 1 : 사용자 1명 출력 (컨트롤러에서 data4를 넘길 때 사용)
    <p>아이디(기본키) : <span th:text="${data4.id}"></span></p>
    <p>이름 : <span th:text="${data4.name}"></span></p>
    -->

    <!-- 실습 2 / 4주차 연습문제 : 다수 사용자 출력 -->
    <table border="1">
        <tr>
            <th>아이디</th>
            <th>이름</th>
            <th>나이</th>
            <th>성별</th>
        </tr>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.name}"></td>
            <td th:text="${user.age}"></td>
            <td th:text="${user.gender}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="4">등록된 사용자가 없습니다. testdb 테이블에 INSERT 해 주세요.</td>
        </tr>
    </table>
</body>
</html>
